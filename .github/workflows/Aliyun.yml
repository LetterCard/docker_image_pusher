# 定时检测上游 umami 新版本：
#   发现更新 -> 当前工作流内直接推送到阿里云 -> 更新 VERSION 留档并提交。
# 不依赖"改文件触发 docker.yml"，因此用默认 GITHUB_TOKEN 即可，无需 PAT。
name: Sync Umami to Aliyun

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测上游版本并判断是否更新
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request

          IMG="umami-software/umami"
          MOZ={"User-Agent":"umami-sync"}
          def curl(url,h=None):
              r=urllib.request.Request(url,headers=h or MOZ)
              return json.load(urllib.request.urlopen(r,timeout=30))
          def semver(t):
              m=re.fullmatch(r"(\d+)\.(\d+)\.(\d+)",t)
              return tuple(map(int,m.groups())) if m else None

          tok=curl("https://ghcr.io/token?scope=repository:%s:pull"%IMG)["token"]
          tags=curl("https://ghcr.io/v2/%s/tags/list"%IMG,
                    {"Authorization":"Bearer "+tok,**MOZ})["tags"]

          # 读取留档版本，只在与当前相同主版本内找最新，避免跨大版本(2->3)跳跃
          cur=open("VERSION").read().strip()
          c=semver(cur)
          if not c:
              print("VERSION 内容非法，请写成纯版本号如 3.1.0")
              raise SystemExit(1)
          cands=sorted(v for v in (semver(t) for t in tags) if v and v[0]==c[0])
          latest=cands[-1]

          if latest<=c:
              print("已是最新版本:",cur)
          else:
              lv=".".join(map(str,latest))
              print("发现新版: %s -> %s"%(cur,lv))
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write("UMAMI_VERSION=%s\n"%lv)
          PY

      - name: 推送新版到阿里云
        if: env.UMAMI_VERSION != ''
        run: |
          docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"
          IMG="ghcr.io/umami-software/umami:${UMAMI_VERSION}"
          NEW="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/umami:${UMAMI_VERSION}"
          docker pull "$IMG"
          docker tag "$IMG" "$NEW"
          docker push "$NEW"

      - name: 写 VERSION 并提交留档
        if: env.UMAMI_VERSION != ''
        run: |
          echo "${UMAMI_VERSION}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: umami 升级到 ${UMAMI_VERSION}"
          git push
