# 定时检测上游 umami 新版本：
#   发现更新 -> 当前工作流内直接推送到阿里云 -> 更新 VERSION 留档并提交。
name: Sync Umami to Aliyun

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测上游版本并判断是否更新
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request

          REPO = "umami-software/umami"
          MOZ = {"User-Agent": "umami-sync"}

          def curl(url, headers=None):
              req = urllib.request.Request(url, headers=headers or dict(MOZ))
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def semver(t):
              # 兼容 v3.1.0 / 3.1.0
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", t)
              return tuple(map(int, m.groups())) if m else None

          # 通过 GitHub Releases 获取版本（匿名、稳定），排除草稿与预发布
          releases = curl("https://api.github.com/repos/%s/releases" % REPO)
          tags = [r["tag_name"] for r in releases
                  if not r.get("draft") and not r.get("prerelease")]

          cur = open("VERSION").read().strip()
          c = semver(cur)
          if not c:
              print("VERSION 内容非法，请写成纯版本号如 3.1.0")
              raise SystemExit(1)

          # 只在与当前相同主版本(如 3.x)内找最新，避免跨大版本(2->3)跳跃
          cands = sorted(v for v in (semver(t) for t in tags) if v and v[0] == c[0])
          if not cands:
              print("未找到与当前主版本匹配的 Release，暂不更新")
              raise SystemExit(0)

          latest = cands[-1]
          if latest <= c:
              print("已是最新版本:", cur)
          else:
              lv = ".".join(map(str, latest))
              print("发现新版: %s -> %s" % (cur, lv))
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("UMAMI_VERSION=%s\n" % lv)
          PY

      - name: 推送新版到阿里云
        if: env.UMAMI_VERSION != ''
        run: |
          docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"
          IMG="ghcr.io/umami-software/umami:${UMAMI_VERSION}"
          NEW="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/umami:${UMAMI_VERSION}"
          docker pull "$IMG"
          docker tag "$IMG" "$NEW"
          docker push "$NEW"

      - name: 写 VERSION 并提交留档
        if: env.UMAMI_VERSION != ''
        run: |
          echo "${UMAMI_VERSION}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: umami 升级到 ${UMAMI_VERSION}"
          git push
