name: Check Umami Version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-umami:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect latest umami version
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::group::Query GitHub tags API"
          # 用仓库自带的 GITHUB_TOKEN 当 Bearer，避免匿名接口 60次/小时 限流（共享 runner 很容易 403）
          RESP=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/umami-software/umami/tags?per_page=100") || {
              echo "::error::拉取 tags 接口失败（可能限流或网络问题），原始响应："
              echo "${RESP:0:500}"
              exit 1
          }
          echo "接口返回前 300 字符：${RESP:0:300}"
          echo "::endgroup::"

          LATEST=$(printf '%s' "$RESP" \
            | jq -r '.[].name' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)

          if [ -z "$LATEST" ]; then
            echo "::error::未在 tags 中找到可用的语义化版本"
            exit 1
          fi
          echo "检测到最新版本: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update images.txt
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.version }}"
          FILE="images.txt"

          echo "最新版本 = $LATEST"
          echo "运行前 images.txt 内容："; cat "$FILE"

          CURRENT=$(grep -E '^ghcr\.io/umami-software/umami:[0-9]' "$FILE" | head -n1 | awk -F: '{print $NF}')
          echo "解析到的当前版本 = ${CURRENT:-无}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "已是最新（$LATEST），无需更新"
            exit 0
          fi

          echo "更新 $FILE -> $LATEST"
          sed -i -E 's|^(ghcr\.io/umami-software/umami):[0-9]+\.[0-9]+\.[0-9]+.*|\1:'"$LATEST"'|' "$FILE"
          echo "更新后 images.txt 内容："; cat "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: bump umami to ${LATEST}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          echo "::notice::已提交并推送 images.txt 的更新"
