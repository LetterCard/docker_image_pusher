name: Check Umami Version

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点（北京时间 08:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-umami:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest umami version from GitHub tags API
        id: latest
        run: |
          set -euo pipefail
          # 公开接口，无需鉴权（已实测可用）
          BODY=$(curl -fsSL "https://api.github.com/repos/umami-software/umami/tags?per_page=100")
          # 取所有 vX.Y.Z / X.Y.Z 形式的 tag，去掉可能的 v 前缀，按版本号取最大
          LATEST=$(printf '%s' "$BODY" \
            | jq -r '.[].name' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "未从 GitHub tags 接口获取到可用的 umami 版本"
            exit 1
          fi
          echo "检测到最新版本: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update images.txt when version changed
        run: |
          set -euo pipefail
          LATEST="${{ steps.latest.outputs.version }}"
          FILE="images.txt"
          KEY="ghcr.io/umami-software/umami"

          CURRENT=$(grep -E "^${KEY}:" "$FILE" | head -n1 | awk -F: '{print $NF}')
          echo "images.txt 当前版本: ${CURRENT:-无} / 最新版本: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "已是最新，无需更新"
            exit 0
          fi

          echo "将 $KEY 由 ${CURRENT:-无} 更新为 $LATEST"
          sed -i -E "s|^(ghcr\.io/umami-software/umami):[0-9]+\.[0-9]+\.[0-9]+.*|\1:${LATEST}|" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: bump umami to ${LATEST}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
